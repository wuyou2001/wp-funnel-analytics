name: Build and Release WordPress Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Plugin Package
        run: |
          PLUGIN_DIR="wp-funnel-analytics"
          zip -q -r "${PLUGIN_DIR}.zip" "$PLUGIN_DIR" -x "*.DS_Store" "*.bak"
          echo "ZIP_NAME=${PLUGIN_DIR}.zip" >> $GITHUB_ENV
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.TAG_NAME }}
          body: |
            ## 🚀 WP Funnel Analytics 自动构建发行版
            
            - **版本号**：${{ env.TAG_NAME }}
            - **自动更新支持**：已安装的 WordPress 站点将在后台自动收到更新提示并支持一键在线升级。
          files: |
            ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Releases (Keep Only Latest)
        run: |
          echo "正在检查并删除旧版本发行版，仅保留最新发布的 ${{ env.TAG_NAME }}..."
          gh release list --limit 100 --json tagName | jq -r '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "${{ env.TAG_NAME }}" ]; then
              echo ">>> 删除旧 Release: $tag"
              gh release delete "$tag" --yes || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
